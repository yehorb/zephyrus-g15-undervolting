# MangoHud settings for logging sessions. Use from Steam launch options:
#   MANGOHUD_CONFIGFILE=$HOME/Projects/undervolting/tools/mangohud.conf mangohud %command%
# (pci_dev can't go in MANGOHUD_CONFIG: MangoHud splits that variable on ':' too.)
# (Steam runs launch options through /bin/sh, so $HOME is expanded there.)

# read stats from the RTX 3080, not the integrated Radeon
pci_dev=0000:01:00.0

autostart_log=1
# MangoHud expands only a leading ~ here, not $HOME
output_folder=~/Projects/undervolting/logs/mangohud

# visibility. Do NOT use no_display: MangoHud 0.8.4 then writes no log at all.
# Invisible overlay that still logs:
fps_only
font_size=8
alpha=0
background_alpha=0
# Small faint FPS counter instead: replace the two alpha lines with
#alpha=0.5
#position=top-right
